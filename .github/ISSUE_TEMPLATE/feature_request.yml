name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like and why.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What pain point are you experiencing?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work? Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or workarounds have you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of localup does this relate to?
      options:
        - CLI
        - Client Library (Rust)
        - Relay / Exit Node
        - HTTP/HTTPS Tunnels
        - TCP Tunnels
        - TLS/SNI Tunnels
        - Authentication / JWT
        - Dashboard / Web UI
        - Desktop App
        - Node.js SDK
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: Importance
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important - impacts my workflow
        - Critical - blocking my use case

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or examples that help explain the feature.
